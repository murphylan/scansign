services:
  db:
    image: mirror.ccs.tencentyun.com/library/postgres:17-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scansign}
      POSTGRES_USER: ${POSTGRES_USER:-scansign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scansign} -d ${POSTGRES_DB:-scansign}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scansign}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-scansign}?schema=tool
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-murphy_session}
      SESSION_EXPIRY_DAYS: ${SESSION_EXPIRY_DAYS:-7}
      # 手机号验证码登录：首次以该手机号登录即成为管理员/运营台账号
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      OPS_SUPER_USER_PHONE: ${OPS_SUPER_USER_PHONE:-}
      # 短信服务商：留空=Mock(验证码打印到日志)；aliyun/tencent/unisms 需另配密钥
      SMS_PROVIDER: ${SMS_PROVIDER:-}

volumes:
  pgdata:
